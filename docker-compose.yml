services:
  web:
    build:
      context: .
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:?Set VITE_AUTH0_DOMAIN (use --env-file .env.local)}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:?Set VITE_AUTH0_CLIENT_ID (use --env-file .env.local)}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        APP_RELEASE_TAG: ${APP_RELEASE_TAG:-docker}
    ports:
      - "8080:80"
